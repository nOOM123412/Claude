<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Web</title>
    <style>
        body {
            background-color: #1A1A1A;
            color: #ECECEC;
            font-family: 'Helvetica', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        #header {
            font-family: 'Georgia', serif;
            font-size: 22px;
            font-weight: bold;
            color: #ECECEC;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .header-left { display: flex; align-items: center; }
        .header-sub { font-size: 14px; color: #888; font-family: Helvetica; margin-left: 10px; }
        
        /* Стили для робота в правом верхнем углу */
        .claude-robot {
            width: 40px;
            height: 40px;
            color: #D97757;
            /* Плавное покачивание для "живости" */
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        #chat-container {
            flex: 1;
            background-color: #1A1A1A;
            overflow-y: auto;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user-msg {
            align-self: flex-end;
            text-align: right;
            color: #ECECEC;
            background-color: #2C2C2C;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .ai-msg {
            align-self: flex-start;
            text-align: left;
            color: #ECECEC;
        }
        .ai-title { color: #D97757; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        #user-input {
            flex: 1;
            background-color: #2C2C2C;
            border: 1px solid #383838;
            color: #ECECEC;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Helvetica', sans-serif;
            font-size: 15px;
            resize: none;
            height: 50px;
        }
        #user-input:focus { outline: none; border-color: #D97757; }
        button {
            background-color: #D97757;
            color: #1A1A1A;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        button:hover { background-color: #E88B6B; }
        button:disabled { background-color: #383838; color: #888; cursor: not-allowed; }
        .btn-gray { background-color: #333; color: #ECECEC; }
        .btn-gray:hover { background-color: #444; }
        #status { color: #888; font-size: 12px; margin-top: 5px; text-align: center; min-height: 18px; }
        
        .file-label {
            background-color: #333;
            color: #ECECEC;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: inline-block;
            transition: 0.2s;
        }
        .file-label:hover { background-color: #444; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <div class="header-left">
            Claude <span class="header-sub">Claude 3.5 Sonnet</span>
        </div>
        
        <!-- РОБОТ (SVG-иконка) -->
        <svg class="claude-robot" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="8" width="16" height="12" rx="4" fill="currentColor"/>
            <rect x="7" y="11" width="2" height="2" fill="#1A1A1A"/>
            <rect x="15" y="11" width="2" height="2" fill="#1A1A1A"/>
            <path d="M9 15H15" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 4V8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M8 16V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M12 16V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 16V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </div>

    <div id="chat-container"></div>
    
    <div class="controls">
        <textarea id="user-input" placeholder="Напишите сообщение... (Enter - отправить, Shift+Enter - перенос строки)"></textarea>
        
        <label for="file-input" class="file-label">📎 Прикрепить</label>
        <input type="file" id="file-input" accept="image/*">
        
        <button id="send-btn" onclick="sendMessage()">Отправить</button>
    </div>
    <div id="status"></div>

    <script>
        const API_KEY = "sk-cvc-8613eb8512ef6b9e9a6c7215bd14bd813c9edd61efa3feca269e6fa7bc47cd54";
        const BASE_URL = "https://api.aikeysforyou.com/v1";
        const MODEL = "deepseek-v4-flash";
        
        let currentImageB64 = null;
        
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const statusDiv = document.getElementById("status");
        const fileInput = document.getElementById("file-input");
        const clearBtn = document.getElementById("clear-btn");

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            if (role === 'assistant') {
                const title = document.createElement("div");
                title.className = "ai-title";
                title.innerText = "Claude";
                div.appendChild(title);
            }
            
            const content = document.createElement("div");
            content.innerText = text;
            div.appendChild(content);
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return content;
        }

        clearBtn.addEventListener("click", () => {
            currentImageB64 = null;
            chatContainer.innerHTML = "";
            statusDiv.innerText = "История очищена";
        });

        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                currentImageB64 = event.target.result.split(",")[1];
                statusDiv.innerText = "Картинка прикреплена";
            };
            reader.readAsDataURL(file);
        });

        userInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !currentImageB64) return;

            userInput.value = "";
            sendBtn.disabled = true;
            statusDiv.innerText = "Думает...";
            
            const displayText = text || "Посмотри на картинку.";
            addMessage("user", displayText);
            
            const contentList = [{ "type": "text", "text": displayText }];
            if (currentImageB64) {
                contentList.push({ "type": "image_url", "image_url": { "url": `data:image/jpeg;base64,${currentImageB64}` } });
            }
            
            currentImageB64 = null; 
            fileInput.value = "";

            const aiContentDiv = addMessage("assistant", "");
            
            try {
                const response = await fetch(`${BASE_URL}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": MODEL,
                        "messages": [{ "role": "user", "content": contentList }],
                        "stream": true
                    })
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    aiContentDiv.innerText = `Ошибка API: ${errText}`;
                    statusDiv.innerText = "";
                    sendBtn.disabled = false;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");
                    
                    for (const line of lines) {
                        if (line.startsWith("data: ") && line !== "data: [DONE]") {
                            try {
                                const parsed = JSON.parse(line.substring(6));
                                if (parsed.choices && parsed.choices.length > 0) {
                                    const delta = parsed.choices[0].delta || {};
                                    const content = delta.content || "";
                                    if (content) {
                                        fullText += content;
                                        aiContentDiv.innerText = fullText;
                                        chatContainer.scrollTop = chatContainer.scrollHeight;
                                    }
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                statusDiv.innerText = "";
                
            } catch (err) {
                aiContentDiv.innerText = `Ошибка сети (возможно CORS): ${err.message}`;
                statusDiv.innerText = "Ошибка";
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
